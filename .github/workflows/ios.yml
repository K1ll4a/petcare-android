name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache/restore@v4
        id: konan
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.2.21
      - name: Shared Native contracts
        run: bash scripts/check-ios.sh native
      - name: iOS app build and UI test
        run: bash scripts/check-ios.sh ui
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/PetCare.app iosApp/build/PetCare-simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: petcare-ios-simulator
          path: iosApp/build/PetCare-simulator.zip
      - name: Upload iOS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            shared/build/reports/tests/
            iosApp/build/TestResults.xcresult
            iosApp/build/diagnostics/
      - uses: actions/cache/save@v4
        if: always() && steps.konan.outputs.cache-hit != 'true'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.2.21
